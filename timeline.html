<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limak · 50 Yıl</title>
<link rel="stylesheet" href="assets/css/base.css?v=47">
<link rel="stylesheet" href="assets/css/timeline.css?v=47">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238ce563'/%3E%3Cpath d='M11 8v13h10' stroke='%2304090a' stroke-width='3.4' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
</head>
<body class="tl">

<!-- dönem ışığı: kaydırdıkça tüm sayfanın rengi değişir -->
<div class="era" id="era" aria-hidden="true">
  <span class="era__glow"></span>
  <canvas class="era__px" id="eraPx"></canvas>
</div>

<header class="topbar">
  <a class="brand" href="index.html">
    <img class="brand__logo" src="assets/img/logo-50yil.png" alt="Limak — 50. yıl" decoding="async">
    <span class="brand__sep" aria-hidden="true"></span>
    <span class="brand__text">Limak <em>· 50 Yıl</em></span>
  </a>
  <span class="tl__counter eyebrow tabular" id="counter">01 / 24</span>
  <a class="btn-back" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Çıkış
  </a>
</header>

<!-- ═══ SAHNE ═══ -->
<main class="stagewrap">

  <!-- dev yıl: kilometre sayacı gibi dönen rakamlar -->
  <div class="yearbig" aria-hidden="true">
    <div class="odo" id="odo"></div>
    <span class="yearbig__label eyebrow" id="yearLabel"></span>
  </div>
  <span class="sr-only" id="yearBig" aria-live="polite"></span>

  <!-- içerik: kitap sayfası gibi açılır -->
  <div class="book" id="book">
    <article class="card" id="card">
      <div class="card__media">
        <img class="card__img" id="cardImg" alt="" decoding="async">
        <span class="card__mediafall" id="cardFall"></span>
        <span class="card__sector eyebrow" id="cardSector"></span>
      </div>
      <div class="card__body">
        <span class="card__year eyebrow tabular" id="cardYear"></span>
        <h2 class="card__title" id="cardTitle"></h2>
        <p class="card__sub" id="cardSub"></p>
        <p class="card__text" id="cardText"></p>
        <ul class="card__stats" id="cardStats"></ul>
      </div>
    </article>
  </div>
</main>

<!-- ═══ RAY ═══ -->
<footer class="rail" id="rail">
  <div class="rail__decades" id="decades" aria-hidden="true"></div>
  <div class="rail__line" aria-hidden="true"></div>
  <div class="rail__track" id="track"></div>
  <div class="rail__future" id="future" aria-hidden="true"></div>
  <p class="rail__hint eyebrow" id="railHint">Sürükle · ok tuşları · düğüme dokun</p>
</footer>

<span class="grain" aria-hidden="true"></span>

<script src="assets/data/timeline.js?v=47"></script>
<script src="assets/js/timeline.js?v=47"></script>
</body>
</html>
